on:
  workflow_call:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        crystal: [1.19.1]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download source
        uses: actions/checkout@v6
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install libraries
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
               brew install libxml2
          elif [ "$RUNNER_OS" == "Linux" ]; then
               # See: https://github.com/crystal-lang/crystal/issues/7177
               sudo apt update && sudo apt install -y lld
          fi
        shell: bash
      - name: Cache shards
        uses: actions/cache@v5
        with:
          path: lib
          key: shards-${{ runner.os }}-${{ hashFiles('shard.lock') }}
          restore-keys: |
            shards-${{ runner.os }}-
      - name: Install shards
        run: shards install
      - name: Run tests
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
               export PKG_CONFIG_PATH="$PKG_CONFIG_PATH:/usr/local/opt/libxml2/lib/pkgconfig"
               link_flags=()
          elif [ "$RUNNER_OS" == "Linux" ]; then
               link_flags=(--link-flags=-fuse-ld=lld)
          fi
          find spec -name "*_spec.cr" -print0 | xargs -0 -n 25 crystal spec "${link_flags[@]}"
        env:
          LOG_LEVEL: NONE
      - name: Build
        run: shards build
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-
      - name: Install npm dependencies
        run: npm ci
      # npm audit checks the copy of DOMPurify that npm installs, not the copy
      # Trix actually ships. Make sure their versions match, so the audit is
      # true. If this fails, change the DOMPurify version in package.json to
      # match the one Trix ships.
      - name: Check installed DOMPurify matches the copy inlined in Trix
        run: |
          inlined=$(grep -o "DOMPurify [0-9][0-9.]*" node_modules/trix/dist/trix.esm.min.js | sort -u)
          installed=$(npm ls dompurify --json | jq -r '.dependencies.trix.dependencies.dompurify.version')
          echo "Trix inlines: $inlined; installed: DOMPurify $installed"
          if [ "$inlined" != "DOMPurify $installed" ]; then
            echo "Update the trix > dompurify override in package.json to match."
            exit 1
          fi
        shell: bash
      - name: Audit npm dependencies
        # Fails on any high or critical advisory not in the allowlist, and on
        # any allowlist entry that is no longer reported, so none go stale.
        run: |
          audit="$RUNNER_TEMP/audit.json"
          npm audit --json --omit=dev > "$audit" || true
          found=$(jq -r '[.vulnerabilities[].via[] | objects
                          | select(.severity == "high" or .severity == "critical")
                          | .url | sub(".*/"; "")] | unique[]' "$audit" | LC_ALL=C sort)
          allowed=$(jq -r '.[].id' .github/npm-audit-allowlist.json | LC_ALL=C sort)
          unexpected=$(LC_ALL=C comm -23 <(echo "$found") <(echo "$allowed") | grep . || true)
          stale=$(LC_ALL=C comm -13 <(echo "$found") <(echo "$allowed") | grep . || true)
          if [ -n "$unexpected" ]; then
            echo "Advisories not in the allowlist:"
            echo "$unexpected"
          fi
          if [ -n "$stale" ]; then
            echo "Allowlist entries no longer reported (remove them):"
            echo "$stale"
          fi
          [ -z "$unexpected" ] && [ -z "$stale" ]
        shell: bash
      - name: Run npm tests
        run: npm run test
